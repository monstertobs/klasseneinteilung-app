{% extends "base.html" %}

{% block title %}Elternwunsch hinzuf&uuml;gen — Klasseneinteilung{% endblock %}

{% block content %}
<div class="page-header">
    <h2>Elternwunsch hinzuf&uuml;gen</h2>
</div>

<div class="form-container">
    <form method="POST" action="{{ url_for('add_wish') }}">
        <div class="form-group">
            <label for="student_id">Sch&uuml;ler</label>
            <select id="student_id" name="student_id" class="form-control" required>
                <option value="">Bitte w&auml;hlen</option>
                {% for student in students %}
                <option value="{{ student.id }}">{{ student.lastname }}, {{ student.firstname }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="wish_type">Wunsch-Typ</label>
            <select id="wish_type" name="wish_type" class="form-control" required onchange="toggleRelatedStudent()">
                <option value="">Bitte w&auml;hlen</option>
                <option value="together">Zusammen mit anderem Sch&uuml;ler</option>
                <option value="separated">Getrennt von anderem Sch&uuml;ler</option>
                <option value="other">Sonstiger Wunsch</option>
            </select>
        </div>

        <div class="form-group" id="related_student_group" style="display:none;">
            <label for="related_student_id">Bezugsperson (anderer Sch&uuml;ler)</label>
            <select id="related_student_id" name="related_student_id" class="form-control">
                <option value="">Bitte w&auml;hlen</option>
                {% for student in students %}
                <option value="{{ student.id }}">{{ student.lastname }}, {{ student.firstname }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="description">Beschreibung</label>
            <textarea id="description" name="description" class="form-control" rows="3"
                      placeholder="Zus&auml;tzliche Informationen zum Wunsch"></textarea>
        </div>

        <div class="form-actions">
            <a href="{{ url_for('wishes') }}" class="btn btn-secondary">Abbrechen</a>
            <button type="submit" class="btn btn-primary">Wunsch hinzuf&uuml;gen</button>
        </div>
    </form>
</div>

<script>
function toggleRelatedStudent() {
    const wishType = document.getElementById('wish_type').value;
    const relatedGroup = document.getElementById('related_student_group');

    if (wishType === 'together' || wishType === 'separated') {
        relatedGroup.style.display = 'block';
    } else {
        relatedGroup.style.display = 'none';
    }
}
</script>
{% endblock %}
