{% extends "base.html" %}

{% block title %}Sch&uuml;ler hinzuf&uuml;gen — Klasseneinteilung{% endblock %}

{% block content %}
<div class="page-header">
    <h2>Sch&uuml;ler hinzuf&uuml;gen</h2>
</div>

<div class="form-container">
    <form method="POST" action="{{ url_for('add_student') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-row">
            <div class="form-group">
                <label for="firstname">Vorname</label>
                <input type="text" id="firstname" name="firstname" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="lastname">Nachname</label>
                <input type="text" id="lastname" name="lastname" class="form-control" required>
            </div>
        </div>

        <div class="form-group">
            <label for="gender">Geschlecht</label>
            <select id="gender" name="gender" class="form-control">
                <option value="">Bitte w&auml;hlen</option>
                <option value="m">M&auml;nnlich</option>
                <option value="w">Weiblich</option>
            </select>
        </div>

        <div class="form-group">
            <label for="wohnort">Wohnort / Schulweg</label>
            <input type="text" id="wohnort" name="wohnort" class="form-control"
                   placeholder="z.B. Stadtteil, Stra&szlig;e oder Busroute">
            <small class="form-text">Hilft bei der Bildung von Fahrgemeinschaften</small>
        </div>

        <div class="form-group">
            <label for="schulform">Schulform</label>
            <select id="schulform" name="schulform" class="form-control">
                <option value="">Bitte w&auml;hlen</option>
                <option value="H">Hauptschule (H)</option>
                <option value="R">Realschule (R)</option>
                <option value="G">Gymnasium (G)</option>
                <option value="IB">Inklusive Beschulung (IB)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="religion">Religion</label>
            <select id="religion" name="religion" class="form-control">
                <option value="">Bitte w&auml;hlen</option>
                <option value="ethik">Ethik</option>
                <option value="katholisch">Katholische Religion</option>
                <option value="evangelisch">Evangelische Religion</option>
            </select>
        </div>

        <div class="form-group">
            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                <input type="checkbox" name="sportlich" value="1">
                Besonders sportlich (Sportklasse)
            </label>
        </div>

        <div class="form-group">
            <label>Interesse an Sportklasse</label>
            <div style="display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.5rem;">
                <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                    <input type="checkbox" name="sport_interesse" value="1">
                    Sport
                </label>
            </div>
            <small class="form-text">W&auml;hlen Sie bei Interesse an Sportklasse</small>
        </div>

        <div class="form-group">
            <label>
                <input type="checkbox" name="ikl" value="1">
                IKL-Status (Intensivklasse / Sprachf&ouml;rderung)
            </label>
        </div>

        <div class="form-group">
            <label for="special_needs">Inklusiver F&ouml;rderbedarf</label>
            <select id="special_needs" name="special_needs" class="form-control">
                <option value="">Keiner</option>
                <option value="hoerschaedigung">H&ouml;ren</option>
                <option value="sprache">Sprache</option>
                <option value="sozial_emotional">Sozial/Emotional (ESE)</option>
                <option value="lernen">Lernen</option>
                <option value="sehen">Sehen</option>
                <option value="kme">KME (k&ouml;rperlich-motorisch)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="notes">Notizen</label>
            <textarea id="notes" name="notes" class="form-control" rows="3"
                      placeholder="Zus&auml;tzliche Informationen"></textarea>
        </div>

        <div class="form-actions">
            <a href="{{ url_for('students') }}" class="btn btn-secondary">Abbrechen</a>
            <button type="submit" class="btn btn-primary">Sch&uuml;ler hinzuf&uuml;gen</button>
        </div>
    </form>
</div>
{% endblock %}
